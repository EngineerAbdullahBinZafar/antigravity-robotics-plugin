<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="50%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>

    <!-- Neon Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>

    <!-- Core Iris Gradient -->
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="1" />
      <stop offset="40%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#0B0F17" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05080E" stop-opacity="1" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Outer Shield (Baked 10% Margin: Fits within 512x512) -->
  <polygon points="256,38 438,143 438,353 256,458 74,353 74,143"
           fill="url(#bgGrad)"
           stroke="url(#cyanGrad)"
           stroke-width="8"
           stroke-linejoin="round" />

  <!-- Inner Tech Inset Border -->
  <polygon points="256,58 420,153 420,343 256,438 92,343 92,153"
           fill="none"
           stroke="url(#emeraldGrad)"
           stroke-width="2.5"
           stroke-dasharray="16,8"
           opacity="0.6" />

  <!-- Radar / LiDAR Range Concentric Rings -->
  <circle cx="256" cy="248" r="140" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.3" />
  <circle cx="256" cy="248" r="100" fill="none" stroke="#00FFA3" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />
  <circle cx="256" cy="248" r="60" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.5" />

  <!-- Crosshairs / Radar Axis -->
  <line x1="256" y1="88" x2="256" y2="408" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8,8" />
  <line x1="96" y1="248" x2="416" y2="248" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8,8" />

  <!-- LiDAR Sweep Arcs -->
  <path d="M 186,178 A 100,100 0 0,1 326,178" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 156,248 A 100,100 0 0,0 356,248" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="12,12" stroke-linecap="round" opacity="0.7" />

  <!-- Robotic Eye / Sensor Core -->
  <circle cx="256" cy="248" r="42" fill="url(#irisGrad)" stroke="url(#emeraldGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="256" cy="248" r="16" fill="#00FFA3" filter="url(#glow)" />
  <circle cx="249" cy="241" r="5" fill="#FFFFFF" opacity="0.9" />

  <!-- Distributed ROS 2 Graph Nodes & Bus Traces -->
  <!-- Top Node -->
  <line x1="256" y1="120" x2="256" y2="188" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <circle cx="256" cy="115" r="12" fill="#0E1626" stroke="#00FFA3" stroke-width="3.5" filter="url(#glow)" />
  <circle cx="256" cy="115" r="4" fill="#00FFA3" />

  <!-- Bottom Left Node -->
  <line x1="145" y1="312" x2="204" y2="278" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <circle cx="140" cy="315" r="12" fill="#0E1626" stroke="#00F0FF" stroke-width="3.5" filter="url(#glow)" />
  <circle cx="140" cy="315" r="4" fill="#00F0FF" />

  <!-- Bottom Right Node -->
  <line x1="367" y1="312" x2="308" y2="278" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <circle cx="372" cy="315" r="12" fill="#0E1626" stroke="#00FFA3" stroke-width="3.5" filter="url(#glow)" />
  <circle cx="372" cy="315" r="4" fill="#00FFA3" />

  <!-- Geometric Accent Brackets -->
  <path d="M 200,90 L 256,60 L 312,90" fill="none" stroke="#00FFA3" stroke-width="3" stroke-linecap="round" />
  <path d="M 200,406 L 256,436 L 312,406" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
</svg>
